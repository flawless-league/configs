// Flawless Movie config

// Start and stop recording
bind 9 "video-pipe"
bind 0 "stopvideo"

// Recording settings
seta cl_aviFrameRate "360"
seta cl_aviPipeFormat "-preset medium -crf 5 -vcodec libx264 -flags +cgop -pix_fmt yuv420p -bf 2 -codec:2 aac -strict -2 -b:a 160k -r:a 22050 -movflags faststart"

// Timescale binds
bind z "timescale 0"
bind x "timescale 0.5"
bind c "timescale 1"
bind v "timescale 3"
bind b "timescale 10"
bind n "timescale 50"
bind m "timescale 100"

// Take a screenshot
bind p "screenshotjpeg"

// Settings
seta r_gamma "1.4"
seta r_ext_multisample "8"
seta r_ext_max_anisotropy "32"
seta r_texturebits "32"
seta r_texturemode "GL_LINEAR_MIPMAP_LINEAR"
seta r_picmip "0"
seta r_overbrightbits "0"
seta r_overrideview "1"
seta r_novis "0"
seta r_normalMapping "1"
seta r_parallaxMapping "1"
seta r_genNormalMaps "0"
seta r_glossType "1"
seta r_hdr "1"
seta r_dynamiclight "1"
seta r_ext_compressed_textures "1"
seta r_ext_direct_state_access "1"
seta r_ext_framebuffer_multisample "0"
seta r_ext_gamma_control "1"
seta r_ext_max_anisotropy "32"
seta r_ext_multisample "8"
seta r_ext_supersample "1"
seta r_ext_texture_filter_anisotropic "1"
seta r_ext_texture_float "1"
seta r_floatLightmap "0"
seta r_bloom "0"

// HUD settings
seta cg_draw2d "1"
seta cg_mappos "0"
seta cg_drawclock "0"
seta cg_drawfps "0"
seta cg_drawhealth "1"
seta cg_drawteamscores "1"
seta cg_drawteamoverlay "0"
seta cg_drawteamoverlayscores "0"
seta cg_drawtimer "1"
seta cg_drawcrosshairnames "0"
seta cg_drawFriend "0"
seta cg_drawmaplocation "0"
seta cg_drawsnapshot "0"
seta cg_drawstatus "0"
seta cg_hudweaponinfo "0"
seta cg_speedo "0"

// Gun settings
seta cg_showgun "1"
seta r_fov "110"
seta cg_gunsize "1"

// Crosshair settings
seta cg_drawcrosshair "8"
seta cg_crosshairrgb "1 1 1 1"
seta cg_crosshairfriendrgb "1 1 1 1"
seta cg_crosshairsize "20"
seta cg_scopeRGB "0,0,0,1"
seta cg_scopefriendrgb "0,0,0,1"
seta cg_scopesr8 "1"
seta cg_scopeg36 "1"
seta cg_scopefrf1 "1"
seta cg_scopePSG "1"
seta cg_scopering "0"

// Hit settings
seta cg_visibleBleeding "5"
seta cg_brassTime "2500"
seta cg_sfxSurfaceImpacts "1"
seta cg_sfxBreathing "1"
seta cg_sfxMuzzleFlash "1"
seta cg_sfxParticles "1"
seta cg_sfxShowDamage "1"

// Killlog settings
seta cg_drawKillLog "2"
seta cg_showbullethits "1"
seta cg_msgHeight "6"

// Hit & killsound
seta cg_hitsound "1"
seta cg_killsound "1"

// Disable chat
seta cg_chatHeight "0"
seta cg_chatTime "0"
seta cg_chatSound "0"

// Skin color
seta cg_skinAlly "8"
seta cg_skinEnemy "2"
seta cg_skinFixed "0"

// volume
seta s_volume "0.375000"
seta s_musicvolume "0"
seta s_muteWhenMinimized "1"
seta s_muteWhenUnfocused "1"

// resolution
seta cl_renderer "vulkan"
seta r_renderScale "3"
seta r_mode "-2"
seta r_fullscreen "1"
seta r_customWidth "1920"
seta r_customHeight "1080"
seta r_renderWidth "1920"
seta r_renderHeight "1080"
seta r_displayrefresh "0"

// sens
seta sensitivity "1"
